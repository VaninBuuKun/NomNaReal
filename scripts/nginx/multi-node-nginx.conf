# NomNa Multi-Node Local Load Balancer Configuration
# Usage with Docker:
#   docker run --rm -it --name nomna-lb -p 8080:8080 \
#     -v $(pwd)/scripts/nginx/multi-node-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
#     --net=host nginx:alpine
#
# Usage with local Nginx:
#   nginx -p $(pwd) -c scripts/nginx/multi-node-nginx.conf

upstream nomna_backend_cluster {
    # Sticky session via client IP hashing (crucial for initial WebSocket handshake & negotiation)
    ip_hash;

    # Node 1
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    # Node 2
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
}

server {
    listen 8080;
    server_name localhost;

    client_max_body_size 105M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. SignalR Real-Time WebSocket Endpoint
    location /hubs/ {
        proxy_pass http://nomna_backend_cluster;

        # WebSocket Protocol Upgrades
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for persistent real-time connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 2. REST API Endpoints
    location /api/ {
        proxy_pass http://nomna_backend_cluster;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 3. Health Checks
    location /health {
        proxy_pass http://nomna_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 4. Fallback / Client Static Files (optional)
    location / {
        proxy_pass http://nomna_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

