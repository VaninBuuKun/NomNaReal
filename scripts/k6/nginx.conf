events {
    worker_connections 4096;
}

http {
    upstream backend_cluster {
        # In baseline phase, webapi-1 handles traffic.
        # In multi-node phase, webapi-2 will be enabled to demonstrate cross-node fanout.
        server webapi-1:8080 max_fails=3 fail_timeout=10s;
        # server webapi-2:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        # Buffer & timeout optimizations for benchmarking
        client_max_body_size 20M;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # WebSocket proxy configuration
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://backend_cluster;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}
