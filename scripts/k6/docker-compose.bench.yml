services:
  postgres:
    image: postgres:16-alpine
    container_name: bench_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: NomNa
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: 123456
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d NomNa"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - nomna_bench_net

  redis:
    image: redis:7-alpine
    container_name: bench_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - nomna_bench_net

  webapi-1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: bench_webapi_1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=NomNa;Username=db_user;Password=123456
      - ConnectionStrings__Redis=redis:6379
      - Redis=redis:6379
      - NODE_ID=Node-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - nomna_bench_net

  nginx:
    image: nginx:alpine
    container_name: bench_nginx
    ports:
      - "5050:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapi-1
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    networks:
      - nomna_bench_net

  k6:
    image: grafana/k6:latest
    volumes:
      - .:/benchmark:ro
      - ./scenarios:/scripts:ro
      - ./lib:/lib:ro
      - ./lib:/scripts/lib:ro
      - ./results:/results
    environment:
      - TARGET_URL=http://nginx
      - WS_URL=ws://nginx/hubs/chat
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - nomna_bench_net

networks:
  nomna_bench_net:
    driver: bridge
