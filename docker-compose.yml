services:
  postgres:
    image: postgres:16-alpine
    container_name: nomna_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: NomNa
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: 123456
    volumes:
      - NomNa_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d NomNa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nomna_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - NomNa_redis:/data

  coturn:
    image: coturn/coturn:4.6.3-alpine
    container_name: nomna_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49160:49152-49160/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=NomNaSuperSecretTurnKey2026"
      - "--realm=nomna.app"
      - "--min-port=49152"
      - "--max-port=49160"
      - "--verbose"

volumes:
  NomNa_db:
  NomNa_redis:
