# ============================================
# CD Pipeline — Build, Push to GHCR, Deploy to VPS
# ============================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auto_deploy:
        description: 'Tự động deploy lên VPS sau khi build xong?'
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel an active deployment

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # 1. Build & Push Docker image to GHCR
  # ============================================
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
            VITE_DEFAULT_AVATAR=${{ vars.VITE_DEFAULT_AVATAR || '/default-avatar.png' }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 2. Deploy to VPS via SSH
  # ============================================
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: github.event_name != 'workflow_dispatch' || inputs.auto_deploy == true
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e

            echo "📦 Pulling latest image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "🔄 Updating application..."
            cd ${{ vars.DEPLOY_PATH || '~/nomna' }}

            # Update the image reference in docker-compose
            export APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            # Pull all service images and restart
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            echo "🧹 Cleaning old images..."
            docker image prune -f

            echo "✅ Deployment complete!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            echo "⏳ Waiting for health check..."
            sleep 20

            # Check if the app container is healthy
            if docker inspect --format='{{.State.Health.Status}}' nomna_app 2>/dev/null | grep -q "healthy"; then
              echo "✅ App is healthy!"
            else
              echo "⚠️  App health check pending, checking container status..."
              docker ps --filter name=nomna_app --format "table {{.Names}}\t{{.Status}}"
              docker logs nomna_app --tail 20
            fi
