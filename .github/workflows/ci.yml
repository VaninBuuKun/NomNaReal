# ============================================
# CI Pipeline — Validate every push & PR
# ============================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Backend: Restore → Build → (future: Test)
  # ============================================
  backend:
    name: 🔧 Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore NomNa.sln

      - name: Build
        run: dotnet build NomNa.sln --no-restore -c Release

      # Uncomment when you add test projects:
      # - name: Test
      #   run: dotnet test NomNa.sln --no-build -c Release --verbosity normal

  # ============================================
  # Frontend: Install → Type-check → Lint → Build
  # ============================================
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_DEFAULT_AVATAR: /default-avatar.png

  # ============================================
  # Docker: Validate Dockerfile builds correctly
  # ============================================
  docker-build-check:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nomna-app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
